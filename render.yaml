services:
  - type: web
    name: chatflow-chat-application
    runtime: python
    rootDir: chatflow/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL
        value: https://chatflow-chat-application.vercel.app
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
